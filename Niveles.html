<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Niveles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#ECEDEF; --ink:#16181D; --muted:#5E636E; --line:#C9CCD2; --field:#FFFFFF; --accent:#1F4E8C; --danger:#A3162E;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121418; --ink:#F1F2F4; --muted:#9AA0AA; --line:#2C3038; --field:#1B1E24; --accent:#6FA0E6; --danger:#F07A8C; }
}
:root[data-theme="dark"]{ --bg:#121418; --ink:#F1F2F4; --muted:#9AA0AA; --line:#2C3038; --field:#1B1E24; --accent:#6FA0E6; --danger:#F07A8C; }

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:460px;margin:0 auto;padding:28px 22px 40px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

/* Home */
.mark{font-family:var(--display);font-size:22px;letter-spacing:.02em;margin:0 0 56px}
.home h1{font-family:var(--display);font-weight:400;font-size:clamp(48px,15vw,72px);line-height:.95;margin:0 0 14px}
.lead{color:var(--muted);margin:0 0 26px}
.code-in{width:100%;background:var(--field);border:2px solid var(--line);border-radius:14px;padding:16px 18px;font-size:22px;font-weight:500;text-align:center}
.code-in:focus{border-color:var(--ink);outline:none}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px 18px;font-weight:700;font-size:18px;background:var(--ink);color:var(--bg);margin-top:12px}
.btn:disabled{opacity:.45;cursor:default}
.err{color:var(--danger);min-height:1.45em;margin:12px 0 0;font-weight:500}
.scale{list-style:none;margin:40px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.scale li{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.scale .bar{height:8px;border-radius:4px;background:var(--line)}
.scale li:nth-child(1) .bar{width:100%}
.scale li:nth-child(2) .bar{width:80%}
.scale li:nth-child(3) .bar{width:60%}
.scale li:nth-child(4) .bar{width:40%}
.scale li:nth-child(5) .bar{width:20%}
.scale .nm{flex:0 0 66px;font-family:var(--display);font-size:18px;color:var(--ink)}
.bars{flex:1}
.wait h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,12vw,60px);line-height:.95;margin:0 0 14px}
.wa{display:block;text-align:center;text-decoration:none;border-radius:14px;padding:16px 18px;font-weight:700;font-size:18px;background:#1F7A4D;color:#fff;margin-top:12px}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:8px;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
.admin-link{margin-top:auto;padding-top:40px;background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;align-self:center}

/* Reveal */
.reveal{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:28px 22px 36px;background:var(--lv-bg);color:var(--lv-fg);overflow:hidden}
.lvl-user{--lv-bg:#F1F1F1;--lv-fg:#7C7C7C;--lv-dim:rgba(124,124,124,.2)}
.lvl-boy{--lv-bg:#D9DCE1;--lv-fg:#343942;--lv-dim:rgba(52,57,66,.22)}
.lvl-man{--lv-bg:#1F4E8C;--lv-fg:#EAF1FB;--lv-dim:rgba(234,241,251,.25)}
.lvl-boss{--lv-bg:#7A1426;--lv-fg:#FBE9EC;--lv-dim:rgba(251,233,236,.25)}
.lvl-master{--lv-bg:#000000;--lv-fg:#E9D08A;--lv-dim:rgba(233,208,138,.22)}
.reveal .who{margin:0 0 6px;font-size:18px;font-weight:500;opacity:.8}
.status{font-family:var(--display);font-weight:400;margin:0;font-size:clamp(40px,12.5vw,80px);line-height:.95;letter-spacing:.005em}
.reveal .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 0}
.emblem{width:min(34vw,160px);height:min(34vw,160px);color:var(--lv-fg)}
.emblem svg{width:100%;height:100%;display:block}
.lvl-master .emblem svg{filter:drop-shadow(0 0 22px rgba(212,175,55,.55))}
.word{font-family:var(--display);font-weight:400;margin:0;line-height:.88;text-transform:uppercase;font-size:clamp(76px,25vw,180px);letter-spacing:-.01em;text-align:center}
.lvl-master .word{font-size:clamp(64px,19vw,160px);background:linear-gradient(110deg,#8C6A1C 0%,#D4AF37 30%,#FFF4CF 45%,#D4AF37 60%,#8C6A1C 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:16px 0 0;font-size:18px;font-weight:500;text-align:center;opacity:.9}
.in{animation:rise .6s cubic-bezier(.2,.9,.25,1.15) both}
.s1{animation-delay:.1s}.s2{animation-delay:.55s}.s3{animation-delay:1s}.s4{animation-delay:1.5s}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.9)}to{opacity:1;transform:none}}
.lvl-boy .word.in{animation:flop 1.1s ease-out 1s both}
@keyframes flop{0%{opacity:0;transform:translateY(-50px)}45%{opacity:1;transform:translateY(0)}70%{transform:translateY(0) rotate(0)}100%{opacity:1;transform:translateY(6px) rotate(-6deg)}}
.lvl-boss .emblem.in{animation:slam .5s cubic-bezier(.3,1.6,.5,1) .55s both}
@keyframes slam{from{opacity:0;transform:scale(2.2)}to{opacity:1;transform:none}}
.lvl-master .word.in{animation:rise .6s cubic-bezier(.2,.9,.25,1.15) 1s both,shine 3.2s linear 1.8s infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
@media (prefers-reduced-motion: reduce){.in,.word.in,.emblem.in{animation:none !important}}
.ladder{list-style:none;padding:0;margin:0 0 8px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end}
.ladder li{display:flex;flex-direction:column;gap:6px;font-size:12px;text-align:center}
.ladder .step{border-radius:4px;background:var(--lv-dim)}
.ladder li:nth-child(1) .step{height:10px}
.ladder li:nth-child(2) .step{height:20px}
.ladder li:nth-child(3) .step{height:30px}
.ladder li:nth-child(4) .step{height:40px}
.ladder li:nth-child(5) .step{height:50px}
.lvl-user .word{opacity:.55;letter-spacing:.04em}
.lvl-user .word.in{animation:ghost 2.4s ease-in-out 1s both}
@keyframes ghost{0%{opacity:0}20%{opacity:.6}30%{opacity:.1}45%{opacity:.55}55%{opacity:.2}100%{opacity:.55}}
.ladder li.on .step{background:var(--lv-fg)}
.ladder li.here{font-weight:700}
.ladder li:not(.on){opacity:.7}
.back{margin-top:22px;background:transparent;border:2px solid currentColor;color:inherit;border-radius:14px;padding:14px;font-weight:700}

.more{margin:16px 0 0;text-align:center;font-size:14px;opacity:.75}
.board{background:var(--bg);color:var(--ink);padding:36px 22px 48px}
.board-in{max-width:460px;margin:0 auto}
.board h2.bt{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;margin:0 0 6px}
.board p.bs{margin:0 0 24px;color:var(--muted)}
.grp{border-radius:16px;overflow:hidden;margin-bottom:12px;border:1px solid var(--line)}
.grp-h{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--lv-bg);color:var(--lv-fg)}
.grp-h .ic{width:30px;height:30px;flex:0 0 30px}
.grp-h .ic svg{width:100%;height:100%;display:block}
.grp-h .gn{font-family:var(--display);font-size:28px;line-height:1;text-transform:uppercase}
.grp-h .gc{margin-left:auto;font-size:14px;font-weight:700;opacity:.8}
.lvl-master .grp-h .gn{color:#E9D08A}
.names{list-style:none;margin:0;padding:6px 0;background:var(--field)}
.names li{padding:10px 16px;font-size:17px;font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:8px}
.names li + li{border-top:1px solid var(--line)}
.names li.me{font-weight:700}
.names li.me span.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--ink);color:var(--bg)}
.names li.none{color:var(--muted);font-weight:400;font-style:italic}

/* Admin */
.wrap.busy form,.wrap.busy .people{pointer-events:none;opacity:.55;transition:opacity .2s}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.top h1{font-family:var(--display);font-weight:400;font-size:40px;margin:0;line-height:1}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px}
.card{background:var(--field);border:1px solid var(--line);border-radius:16px;padding:16px}
label.lb{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
.txt{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:block;text-align:center;padding:10px 4px;border-radius:10px;border:1px solid var(--line);font-family:var(--display);font-size:17px;cursor:pointer;user-select:none}
.seg input:focus-visible + label{outline:3px solid var(--accent);outline-offset:2px}
.seg input:checked + label.c-user{background:#F1F1F1;color:#7C7C7C;border-color:#BDBDBD}
.seg input:checked + label.c-boy{background:#D9DCE1;color:#343942;border-color:#D9DCE1}
.seg input:checked + label.c-man{background:#1F4E8C;color:#EAF1FB;border-color:#1F4E8C}
.seg input:checked + label.c-boss{background:#7A1426;color:#FBE9EC;border-color:#7A1426}
.seg input:checked + label.c-master{background:#000;color:#E9D08A;border-color:#E9D08A}
.people{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.people h2{font-size:15px;color:var(--muted);font-weight:500;margin:0 0 4px}
.row-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.pname{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.code{font-family:var(--display);font-size:20px;letter-spacing:.18em;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:2px 8px;white-space:nowrap}
.row-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--danger);font-size:14px}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.savebar{position:sticky;bottom:0;margin:24px -22px -40px;padding:14px 22px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.savebar p{margin:0;font-size:14px;color:var(--muted);text-align:center;min-height:1.4em}
.savebar p.bad{color:var(--danger)}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="state">{"people":[{"id":"pmuln3oh0su3","name":"Jaime","level":"user"},{"id":"pmuec3vlulkb","name":"Clara melamed","level":"boy"},{"id":"pmu4ylg9hdt3","name":"Saul Assis","level":"man"},{"id":"pmu48zhbm037","name":"Livay","level":"boy"},{"id":"pmu47jcwvdvu","name":"Joe Harari","level":"boy"},{"id":"pmu47h9selaj","name":"Toby Ashkenazi","level":"boy"},{"id":"pmu47ex3onre","name":"Hyman Harari","level":"user"},{"id":"pmu47787mniz","name":"Rab Uri","level":"boss"},{"id":"pmu473jb6rcr","name":"David Cohav","level":"man"},{"id":"pmu3mgv8jlr8","name":"Max Birbragher","level":"boy"},{"id":"pmu3mgkfl8t3","name":"Murad Naftali","level":"user"},{"id":"pmu3mc5lllb6","name":"Daniel Khafif","level":"master"},{"id":"pmu3llw2h2y8","name":"Menahem Khafif","level":"user"},{"id":"pmu3llrn6dkx","name":"Isaac Tawachi","level":"user"},{"id":"pmu3l1up4jyy","name":"Nissim Harari","level":"man"},{"id":"pmu3kv4ehza2","name":"Nathan harari","level":"man"},{"id":"pmu3kq8vvrpv","name":"Joseph Tarazi","level":"boy"},{"id":"pmu3knk68lre","name":"Eliseo","code":"JBGD","level":"user"},{"id":"pmu3khzv183w","name":"Toby Tawachi","code":"LEFS","level":"master"}]}</script>
<script>
(function(){
  var APP_SRC = document.currentScript.textContent;
  var STYLE_SRC = document.getElementById('app-style').textContent;
  var HEAD = '\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Niveles</title>\n' +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">\n';

  var LEVELS = [
    {id:'user', name:'User', status:'Ni usuario tienes todavía', sub:'Tu cuenta ni existe. Estás cargando.'},
    {id:'boy', name:'Kid', status:'Todavía estás en pañales', sub:'Te falta calle. Mucha.'},
    {id:'man', name:'Man', status:'Ya eres gente', sub:'Vas bien, pero no te creas tanto.'},
    {id:'boss', name:'Boss', status:'Aquí se te respeta', sub:'Pocos llegan hasta acá.'},
    {id:'master', name:'Master', status:'Leyenda viva', sub:'No hay nada más arriba que tú.'}
  ];
  var ICONS = {
    user:'<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="36" r="17" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="7 6"/><path d="M18 88c3-18 16-28 32-28s29 10 32 28" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="7 6" stroke-linecap="round"/><text x="50" y="44" text-anchor="middle" font-size="22" font-family="Arial" font-weight="700" fill="currentColor">?</text></svg>',
    boy:'<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M43 22c0-9 3-15 7-15s7 6 7 15z" fill="currentColor"/><rect x="35" y="22" width="30" height="10" rx="3" fill="currentColor"/><rect x="31" y="34" width="38" height="58" rx="13" fill="none" stroke="currentColor" stroke-width="5"/><path d="M33 52h13M33 64h13M33 76h13" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>',
    man:'<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 42C44 33 30 33 22 42c-6 7-12 7-16 3 1 16 19 23 31 16 6-3 10-6 13-8 3 2 7 5 13 8 12 7 30 0 31-16-4 4-10 4-16-3-8-9-22-9-28 0z" fill="currentColor"/></svg>',
    boss:'<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M12 74 8 30l22 20 20-32 20 32 22-20-4 44z" fill="currentColor"/><rect x="12" y="80" width="76" height="9" rx="2" fill="currentColor"/><circle cx="8" cy="27" r="5" fill="currentColor"/><circle cx="50" cy="15" r="5" fill="currentColor"/><circle cx="92" cy="27" r="5" fill="currentColor"/></svg>',
    master:'<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF4CF"/><stop offset=".45" stop-color="#D4AF37"/><stop offset="1" stop-color="#8C6A1C"/></linearGradient></defs><path d="M18 38 33 16h34l15 22-32 48z" fill="url(#gd)"/><path d="M18 38h64M33 16l9 22 8 48 8-48 9-22M42 38l8-22 8 22" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round" opacity=".55"/></svg>'
  };
  var CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

  var saved = readState();
  var people = saved.people.map(function(p){ return {id:p.id, name:p.name, code:p.code, level:p.level}; });
  var dirty = false;
  var readOnly = false;
  var artifactP = null;

  function readState(){
    try{
      var s = JSON.parse(document.getElementById('state').textContent);
      if (s && Array.isArray(s.people)) return s;
    }catch(e){}
    return {people:[]};
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
  function recall(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function sstore(k,v){ try{ if(v==null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v); }catch(e){} }
  function srecall(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
  function findByName(n){ return saved.people.filter(function(x){ return norm(x.name) === norm(n); })[0]; }
  function norm(s){ return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
  function levelOf(id){ for (var i=0;i<LEVELS.length;i++) if (LEVELS[i].id===id) return i; return 0; }
  function newCode(){
    var code, taken = {};
    people.forEach(function(p){ taken[p.code]=1; });
    do {
      code = '';
      for (var i=0;i<4;i++) code += CHARS[Math.floor(Math.random()*CHARS.length)];
    } while (taken[code]);
    return code;
  }
  function getArtifact(){
    if (!artifactP){
      artifactP = (window.claude && typeof window.claude.use === 'function')
        ? window.claude.use('artifact').catch(function(){ return null; })
        : Promise.resolve(null);
    }
    return artifactP;
  }
  var app = document.getElementById('app');

  /* ---------- Home ---------- */
  function renderHome(prefill, error){
    document.body.style.background = '';
    var scale = LEVELS.slice().reverse().map(function(l){
      return '<li><span class="nm">'+l.name+'</span><span class="bars"><span class="bar" style="display:block"></span></span></li>';
    }).join('');
    app.innerHTML =
      '<main class="wrap home">'+
        '<p class="mark">Niveles</p>'+
        '<h1>¿Qué nivel eres?</h1>'+
        '<p class="lead">Escribe tu nombre y apellido.</p>'+
        '<form id="f" autocomplete="off">'+
          '<label for="code" class="lb" style="position:absolute;left:-9999px">Tu nombre</label>'+
          '<input id="code" class="code-in" maxlength="40" autocapitalize="words" spellcheck="false" placeholder="Nombre y apellido" value="'+esc(prefill||'')+'">'+
          '<button class="btn" type="submit">Ver mi nivel</button>'+
          '<p class="err" role="alert">'+esc(error||'')+'</p>'+
        '</form>'+
        '<ol class="scale" aria-label="Escala de niveles, de mayor a menor">'+scale+'</ol>'+
        '<button class="admin-link" id="toAdmin" type="button">Modo calificar</button>'+
      '</main>';
    var input = document.getElementById('code');
    document.getElementById('f').addEventListener('submit', function(e){
      e.preventDefault();
      var c = input.value.trim();
      if (!c){ renderHome('', 'Escribe tu nombre.'); focusCode(); return; }
      c = c.replace(/\s+/g,' ');
      store('niveles_name', c);
      var p = findByName(c);
      if (p) renderReveal(p); else renderWait(c);
    });
    document.getElementById('toAdmin').addEventListener('click', function(){ sstore('niveles_admin','1'); renderAdmin(); });
  }
  function focusCode(){ var i=document.getElementById('code'); if(i){ i.focus(); i.select(); } }

  /* ---------- Reveal ---------- */
  function renderReveal(p){
    var idx = levelOf(p.level);
    var lv = LEVELS[idx];
    var ladder = LEVELS.map(function(l,i){
      return '<li class="'+(i<=idx?'on':'')+(i===idx?' here':'')+'"><span class="step"></span>'+l.name+'</li>';
    }).join('');
    app.innerHTML =
      '<section class="reveal lvl-'+lv.id+'">'+
        '<p class="who">'+esc(p.name)+', tu status:</p>'+
        '<h1 class="status in s1">'+lv.status+'</h1>'+
        '<div class="stage">'+
          '<div class="emblem in s2">'+ICONS[lv.id]+'</div>'+
          '<h2 class="word in s3">'+lv.name+'</h2>'+
          '<p class="sub in s4">'+lv.sub+'</p>'+
        '</div>'+
        '<ol class="ladder" aria-label="Nivel '+(idx+1)+' de '+LEVELS.length+'">'+ladder+'</ol>'+
        '<p class="more">Desliza para ver quién está en cada nivel</p>'+
        '<button class="back" id="back" type="button">Volver</button>'+
      '</section>'+
      boardHTML(p);
    document.body.style.background = '';
    window.scrollTo(0,0);
    document.getElementById('back').addEventListener('click', function(){ store('niveles_name', null); renderHome(); });
  }

  function boardHTML(me){
    var groups = LEVELS.slice().reverse().map(function(l){
      var list = saved.people.filter(function(x){ return x.level === l.id; })
        .sort(function(a,b){ return a.name.localeCompare(b.name, 'es', {sensitivity:'base'}); });
      var items = list.length ? list.map(function(x){
        var mine = x.id === me.id;
        return '<li'+(mine?' class="me"':'')+'>'+esc(x.name)+(mine?'<span class="tag">Tú</span>':'')+'</li>';
      }).join('') : '<li class="none">Nadie todavía</li>';
      return '<div class="grp lvl-'+l.id+'">'+
        '<div class="grp-h"><span class="ic">'+ICONS[l.id].replace('id="gd"','id="gd-'+l.id+'"').replace('url(#gd)','url(#gd-'+l.id+')')+'</span>'+
        '<span class="gn">'+l.name+'</span><span class="gc">'+list.length+'</span></div>'+
        '<ul class="names">'+items+'</ul></div>';
    }).join('');
    return '<section class="board"><div class="board-in">'+
      '<h2 class="bt">Quién es qué</h2>'+
      '<p class="bs">De lo más alto a lo más bajo.</p>'+
      groups+'</div></section>';
  }

  /* ---------- Esperando ---------- */
  function renderWait(name){
    document.body.style.background = '';
    app.innerHTML =
      '<main class="wrap wait">'+
        '<p class="mark">Niveles</p>'+
        '<h1>'+esc(name)+', todavía no tienes nivel</h1>'+
        '<p class="lead"><span class="pulse" aria-hidden="true"></span>Nadie te ha calificado aún. Deja esta página abierta o vuelve a entrar más tarde: cuando tengas nivel, te sale aquí.</p>'+
        '<p class="lead">¿Escribiste tu nombre completo? Si no, intenta otra vez.</p>'+
        '<button class="btn" id="notme" type="button">Escribir otro nombre</button>'+
      '</main>';
    document.getElementById('notme').addEventListener('click', function(){ store('niveles_name', null); renderHome(); });
  }

  /* ---------- Admin ---------- */
  function segHTML(name, current){
    return '<div class="seg" role="radiogroup" aria-label="Nivel">'+LEVELS.map(function(l){
      var id = name+'-'+l.id;
      return '<input type="radio" name="'+name+'" id="'+id+'" value="'+l.id+'"'+(l.id===current?' checked':'')+'>'+
             '<label for="'+id+'" class="c-'+l.id+'">'+l.name+'</label>';
    }).join('')+'</div>';
  }
  var saveTimer = null, saving = false, failed = false;

  function setStatus(msg, bad){
    var st = document.getElementById('status');
    if (st){ st.textContent = msg || ''; st.className = bad ? 'bad' : ''; }
  }
  function queueSave(delay){
    if (readOnly){ setStatus('Solo el dueño de la app puede guardar calificaciones.', true); return; }
    dirty = true;
    clearTimeout(saveTimer);
    setStatus('Guardando…');
    saveTimer = setTimeout(function(){ saveTimer = null; save(); }, delay);
  }

  function renderAdmin(msg, bad){
    document.body.style.background = '';
    var list = people.length ? people.map(function(p){
      return '<li class="card">'+
        '<div class="row-head"><span class="pname">'+esc(p.name)+'</span></div>'+
        segHTML('lv_'+p.id, p.level)+
        '<div class="row-foot"><span></span><button class="linkbtn" data-del="'+esc(p.id)+'" type="button">Quitar</button></div>'+
      '</li>';
    }).join('') : '<li class="empty">Todavía no has calificado a nadie.</li>';

    app.innerHTML =
      '<main class="wrap'+(saving?' busy':'')+'" id="adm">'+
        '<div class="top"><h1>Calificar</h1><button class="ghost" id="home" type="button">Salir</button></div>'+
        '<form class="card" id="add" autocomplete="off">'+
          '<label class="lb" for="nm">Nombre</label>'+
          '<input class="txt" id="nm" maxlength="40" placeholder="Nombre y apellido">'+
          segHTML('newlv', 'user')+
          '<button class="btn" type="submit">Agregar</button>'+
        '</form>'+
        '<ul class="people"><li><h2>'+people.length+' calificados</h2></li>'+list+'</ul>'+
        '<div class="savebar">'+
          '<p id="status" class="'+(bad?'bad':'')+'" role="status">'+esc(msg || 'Todo se guarda solo.')+'</p>'+
          ((failed && dirty && !readOnly) ? '<button class="btn" id="retry" type="button">Intentar de nuevo</button>' : '')+
        '</div>'+
      '</main>';

    document.getElementById('home').addEventListener('click', function(){
      sstore('niveles_admin', null);
      if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; save(); return; }
      if (saving) return;
      people = saved.people.map(function(p){ return {id:p.id, name:p.name, code:p.code, level:p.level}; });
      dirty = false; failed = false;
      start();
    });
    document.getElementById('add').addEventListener('submit', function(e){
      e.preventDefault();
      if (saving) return;
      var nm = document.getElementById('nm').value.trim();
      if (!nm){ document.getElementById('nm').focus(); return; }
      var lv = (document.querySelector('input[name="newlv"]:checked')||{}).value || 'user';
      if (people.some(function(x){ return norm(x.name) === norm(nm); })){ setStatus('Ya existe alguien con ese nombre. Cámbiale el nivel en la lista.', true); return; }
      people.unshift({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), name:nm.replace(/\s+/g,' '), level:lv});
      renderAdmin();
      queueSave(0);
    });
    app.querySelectorAll('.people input[type=radio]').forEach(function(r){
      r.addEventListener('change', function(){
        var pid = r.name.slice(3);
        people.forEach(function(p){ if (p.id===pid) p.level = r.value; });
        queueSave(900);
      });
    });
    app.querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click', function(){
        if (saving) return;
        var pid = b.getAttribute('data-del');
        var p = people.filter(function(x){ return x.id===pid; })[0];
        if (!p) return;
        if (!b.dataset.armed){
          b.dataset.armed = '1';
          b.textContent = '¿Seguro? Toca otra vez';
          b.style.fontWeight = '700';
          setTimeout(function(){ if (b.isConnected){ delete b.dataset.armed; b.textContent = 'Quitar'; b.style.fontWeight = ''; } }, 4000);
          return;
        }
        people = people.filter(function(x){ return x.id!==pid; });
        renderAdmin();
        queueSave(0);
      });
    });
    var rt = document.getElementById('retry');
    if (rt) rt.addEventListener('click', function(){ failed = false; renderAdmin(); queueSave(0); });
  }

  function buildDoc(state){
    var json = JSON.stringify(state).replace(/</g,'\\u003c');
    return '<!doctype html>\n<html lang="es">\n<head>' + HEAD +
      '<style id="app-style">' + STYLE_SRC + '</style>\n</head>\n<body>\n<div id="app"></div>\n' +
      '<script type="application/json" id="state">' + json + '<\/script>\n' +
      '<script>' + APP_SRC + '<\/script>\n</body>\n</html>\n';
  }

  function save(){
    saving = true;
    var adm = document.getElementById('adm');
    if (adm) adm.classList.add('busy');
    setStatus('Guardando…');
    function fail(msg){
      saving = false; failed = true;
      sstore('niveles_flash', null);
      renderAdmin(msg, true);
    }
    getArtifact().then(function(ns){
      if (!ns){ fail('Guardar solo funciona abriendo la app desde su link de Claude.'); return; }
      sstore('niveles_flash', 'Guardado.');
      return ns.publish(buildDoc({people:people})).then(function(){
        // La página se recarga sola con la versión nueva.
      }, function(err){
        var code = err && err.code;
        if (code === 'conflict'){ return; }
        if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'not_declared'){
          readOnly = true;
          fail('Solo el dueño de la app puede guardar calificaciones.');
        } else if (code === 'rate_limited'){
          fail('Estás guardando muy seguido. Espera unos segundos e intenta de nuevo.');
        } else {
          fail('No se pudo guardar.');
        }
      });
    });
  }

  function start(){
    if (srecall('niveles_admin')) {
      var fl = srecall('niveles_flash'); sstore('niveles_flash', null);
      renderAdmin(fl || ''); return;
    }
    sstore('niveles_flash', null);
    var n = recall('niveles_name');
    if (n){ var p = findByName(n); if (p) renderReveal(p); else renderWait(n); return; }
    renderHome();
  }
  start();
})();
</script>
</body>
</html>
